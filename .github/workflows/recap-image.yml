name: Recap overlay image

# Builds a linux/amd64 image that layers recap onto stock Frigate 0.18.2
# and pushes ghcr.io/sampsonb/frigate:recap-0.18.2.
# The recap-0.17.2 tag is not published here and is left as it is.
# This workflow is for the sampsonb/frigate fork only. It does not publish
# to blakeblackshear/frigate or any other repository.
# A new GHCR package is private by default. The host can build the same
# image from the public git URL without waiting for that package.

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/recap-port-0.18.2-3c87
      - recap-base-0.18.2

permissions:
  contents: read
  packages: write

concurrency:
  group: recap-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlay:
    name: AMD64 overlay
    if: github.repository == 'sampsonb/frigate'
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch the 0.18.2 base branch
        run: git fetch origin recap-base-0.18.2
      - name: Confirm the overlay copies every changed runtime file
        run: python3 docker/recap/check_overlay.py
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Short commit for /api/version
        id: version
        run: echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/recap/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sampsonb/frigate:recap-0.18.2
          build-args: |
            COMMIT=${{ steps.version.outputs.commit }}
          provenance: false
